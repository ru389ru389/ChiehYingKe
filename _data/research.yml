# 研究專長。topic 對應 publications.yml 裡的 topics，用來自動列出相關論文。

- topic: radar
  label: 雷達觀測
  label_en: Radar Observation
  color: blue
  icon: <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 L19 6"/>
  title: 雷達觀測與野外實驗
  title_en: Radar Observation & Field Campaigns
  desc: 操作移動式氣象雷達 TEAM-R，負責場址勘查、系統架設、雷達觀測與資料分析。曾參與西南氣流聯合觀測實驗、五分山雷達站支援觀測、颱風觀測，以及韓國平昌冬奧 ICE-POP 國際觀測實驗。
  desc_en: Operating the TEAM-R mobile weather radar, including site survey, system setup, radar operation and data analysis. Participated in the Southwest Monsoon joint observation experiments, Wufenshan radar station support observations, typhoon observations, and the ICE-POP international campaign for the PyeongChang Winter Olympics in Korea.
  campaigns: true

- topic: retrieval
  label: 風場反演
  label_en: Wind Retrieval
  color: teal
  icon: <path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/>
  title: 風場反演與劇烈天氣分析
  title_en: Wind Retrieval & Severe Weather Analysis
  desc: 以多都卜勒雷達反演三維風場與熱動力場，分析梅雨鋒面、障礙噴流（barrier jet）與北台灣豪大雨的演變機制，揭示中尺度對流系統的動力與熱力結構。
  desc_en: Retrieving three-dimensional wind and thermodynamic fields from multiple-Doppler radar observations to investigate the evolution of Mei-Yu fronts, barrier jets and heavy rainfall over northern Taiwan, revealing the dynamic and thermodynamic structures of mesoscale convective systems.

- topic: da
  label: 資料同化
  label_en: Data Assimilation
  color: amber
  icon: <path d="M4 17c3-6 5-6 8 0s5 6 8 0"/><path d="M4 9h6M14 9h6"/><circle cx="12" cy="9" r="2"/>
  title: 雷達資料同化
  title_en: Radar Data Assimilation
  desc: 在 EnKF / WRF-LETKF 系統中，同化雷達觀測與反演的溫度、水氣等熱動力變數，評估其對模式初始場、雲微物理過程與對流尺度定量降水預報的影響。
  desc_en: Assimilating radar observations together with retrieved thermodynamic variables such as temperature and water vapor in EnKF / WRF-LETKF systems, and evaluating their impact on model initial conditions, cloud microphysical processes and convective-scale quantitative precipitation forecasts.

- topic: ensemble
  label: 系集分析
  label_en: Ensemble Analysis
  color: coral
  icon: <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="9" r="1.5"/><circle cx="15" cy="8" r="1.5"/><circle cx="10" cy="15" r="1.5"/><circle cx="16" cy="15" r="1.5"/>
  title: 系集模擬與機器學習分析
  title_en: Ensemble Simulation & Machine Learning
  desc: 以 WRF 進行系集模擬，結合系集敏感度分析（ESA）與 k-means 等非監督式機器學習分群，探討南、北台灣豪雨的動力與熱力控制因子。
  desc_en: Conducting WRF ensemble simulations combined with ensemble sensitivity analysis (ESA) and unsupervised machine-learning clustering such as k-means to explore the dynamic and thermodynamic controls of heavy rainfall in northern and southern Taiwan.

- topic: arctic
  label: 北極大氣
  label_en: Arctic
  color: green
  icon: <path d="M12 2v20M4 6l16 12M20 6L4 18"/>
  title: 北極大氣研究
  title_en: Arctic Atmosphere
  desc: 投入極地區域大氣垂直耦合研究，以 WRF 模擬並評估衛星觀測，並參與 TaiArctic 台灣北極研究相關活動。
  desc_en: Studying vertical atmospheric coupling in polar regions, using WRF simulations and evaluating satellite observations, and participating in TaiArctic (Taiwan Arctic research) activities.
