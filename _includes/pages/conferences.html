{% include lang-setup.html %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<section class="section">
  <div class="container">
    <div class="year-tabs" role="tablist">
      <button data-y="all">{{ L.all_years }}<small>{% assign n_all = 0 %}{% for y in site.data.conferences %}{% assign n_all = n_all | plus: y.items.size %}{% endfor %}{{ n_all }}</small></button>
      {% for y in site.data.conferences %}
      <button class="{% if forloop.first %}on{% endif %}" data-y="{{ y.year }}">{{ y.year }}<small>{{ y.items.size }}</small></button>
      {% endfor %}
    </div>

    <div class="map-card">
      <div id="confmap" aria-label="{% if lang == 'en' %}World map of conference locations{% else %}研討會地點世界地圖{% endif %}"></div>
      <div class="map-legend">
        <span><i class="dot intl"></i>{{ L.intl }}</span>
        <span><i class="dot local"></i>{{ L.local }}</span>
        <span class="map-hint">{{ L.map_hint }}</span>
      </div>
    </div>

    {% for y in site.data.conferences %}
    <div class="year-panel" data-y="{{ y.year }}"{% unless forloop.first %} hidden{% endunless %}>
      <h2>{{ y.year }}</h2>
      <ul class="conf-list">
        {% for it in y.items %}{% include conf-item.html it=it L=L lang=lang %}{% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</section>

<script>
var CONF_PLACES = {
{%- for pl in site.data.places %}
  "{{ pl[0] }}": { name: {% if lang == 'en' %}{{ pl[1].en | jsonify }}{% else %}{{ pl[1].zh | jsonify }}{% endif %}, lat: {{ pl[1].lat }}, lng: {{ pl[1].lng }} }{% unless forloop.last %},{% endunless %}
{%- endfor %}
};
var CONF_ITEMS = [
{%- for y in site.data.conferences %}{% for it in y.items %}{% if it.place %}
  {%- if lang == 'en' and it.text_en %}{% assign txt = it.text_en %}{% else %}{% assign txt = it.text %}{% endif -%}
  {%- assign venue = txt | split: '<em>' | last | split: '</em>' | first -%}
  { year: "{{ y.year }}", place: "{{ it.place }}", intl: {% if it.intl %}true{% else %}false{% endif %}, venue: {{ venue | jsonify }} },
{%- endif %}{% endfor %}{% endfor %}
];
var CONF_TALKS = {{ L.talks | jsonify }};
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var hasMap = typeof L !== 'undefined' && document.getElementById('confmap');
  var map, layer;
  if (hasMap) {
    map = L.map('confmap', { worldCopyJump: true, scrollWheelZoom: false, minZoom: 1, maxZoom: 10 });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    L.tileLayer('https://{s}.basemaps.cartocdn.com/' + (dark ? 'dark_all' : 'light_all') + '/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
    layer = L.layerGroup().addTo(map);
    map.on('click', function () { map.scrollWheelZoom.enable(); });
  } else {
    var m = document.getElementById('confmap'); if (m) m.closest('.map-card').hidden = true;
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function drawMap(year) {
    if (!hasMap) return;
    layer.clearLayers();
    var groups = {};
    CONF_ITEMS.forEach(function (it) {
      if (year !== 'all' && it.year !== year) return;
      (groups[it.place] = groups[it.place] || []).push(it);
    });
    var pts = [];
    Object.keys(groups).forEach(function (k) {
      var pl = CONF_PLACES[k], list = groups[k];
      if (!pl) return;
      var intl = list.some(function (x) { return x.intl; });
      var mk = L.circleMarker([pl.lat, pl.lng], {
        radius: Math.min(7 + 3 * (list.length - 1), 22),
        color: '#fff', weight: 2, fillOpacity: .9,
        fillColor: intl ? '#e0573a' : '#1f6fb2'
      });
      var html = '<strong>' + esc(pl.name) + '</strong> · ' + list.length + ' ' + esc(CONF_TALKS) + '<ul>' +
        list.map(function (x) { return '<li>' + (year === 'all' ? '<b>' + x.year + '</b> ' : '') + esc(x.venue.replace(/<[^>]+>/g, '')) + '</li>'; }).join('') + '</ul>';
      mk.bindPopup(html, { maxWidth: 300 });
      mk.bindTooltip(pl.name + ' · ' + list.length, { direction: 'top', offset: [0, -6] });
      mk.addTo(layer); pts.push([pl.lat, pl.lng]);
    });
    if (year === 'all' || pts.length === 0) { map.setView([28, 10], 1); }
    else if (pts.length === 1) { map.setView(pts[0], 6); }
    else { map.fitBounds(pts, { padding: [40, 40], maxZoom: 6 }); }
  }

  function show(year) {
    document.querySelectorAll('.year-tabs button').forEach(function (x) { x.classList.toggle('on', x.dataset.y === year); });
    document.querySelectorAll('.year-panel').forEach(function (p) { p.hidden = !(year === 'all' || p.dataset.y === year); });
    drawMap(year);
  }
  document.querySelectorAll('.year-tabs button').forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.y); });
  });
  show(document.querySelector('.year-tabs button.on').dataset.y);
  if (hasMap) setTimeout(function () { map.invalidateSize(); }, 200);
})();
</script>
