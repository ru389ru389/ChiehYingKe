{% include lang-setup.html %}
<section class="section">
  <div class="container">
    <div class="year-tabs" role="tablist">
      {% for y in site.data.conferences %}
      <button class="{% if forloop.first %}on{% endif %}" data-y="{{ y.year }}">{{ y.year }}<small>{{ y.items.size }}</small></button>
      {% endfor %}
    </div>
    {% for y in site.data.conferences %}
    <div class="year-panel" data-y="{{ y.year }}"{% unless forloop.first %} hidden{% endunless %}>
      <h2>{{ y.year }}</h2>
      <ul class="conf-list">
        {% for it in y.items %}{% include conf-item.html it=it L=L lang=lang %}{% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</section>
<script>
document.querySelectorAll('.year-tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.year-tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    document.querySelectorAll('.year-panel').forEach(function (p) { p.hidden = p.dataset.y !== b.dataset.y; });
  });
});
</script>
